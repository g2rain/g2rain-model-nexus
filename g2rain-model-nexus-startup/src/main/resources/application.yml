server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: g2rain-model-nexus
  # 环境切换（dev / nacos 互斥，勿同时激活或 spring.profiles.include）：
  #   SPRING_PROFILES_ACTIVE=dev   → application.yml + application-dev.yml（本地数据源）
  #   SPRING_PROFILES_ACTIVE=nacos → application.yml + application-nacos.yml（注册/配置中心，数据源来自 Nacos）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nacos}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    jdbc-type-for-null: NULL

g2rain:
  springdoc:
    description: 模型网关接口文档
  model-nexus:
    # Filter 协议错误分流；后续追加其它前缀只加 pattern
    protocol-error-path-patterns:
      - /v1/**

# g2rain-starter-spring-doc 已经实现, 但是未发版, 暂自行配置
springdoc:
  default-flat-param-object: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: when_authorized
